---
layout: default
make-smaller-titles: true
---


<div class="container-fluid index">
    <div class="row">

        <div class="col-md-12 main content-panel">

<div class="gravatar">
    <img src="{{ site.baseurl }}{{ site.title_image }}" class="img-circle about-image" height="150" width="150" alt="{{ site.title }}" />
</div>

            <h1 class="header author-header" itemprop="headline">{{ site.title }}</h1>

            <div class="author-text">
                {{ site.title_description }}
            </div>

            {% include social_links.html %}
          </div>
          <div class="col-md-12 main content-panel">

           <div class="articles">
  <h2>Links</h2>

<div class="linktree-wrapper">
  {% for link in site.data.links %}
    <a href="{{ link.url }}" 
       class="link-card" 
       target="_blank" 
       style="--brand-color: {{ link.color | default: '#000000' }};"> 
      
      {% if link.icon %}
        <i class="{{ link.icon }}"></i>
      {% endif %}
      <span>{{ link.name }}</span>
    </a>
  {% endfor %}
</div>

  </div>

        </div>

    </div>
</div>
